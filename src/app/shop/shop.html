<html>
<head>
<link rel="stylesheet" href="shop.css">
</head>
<body>
<div class="shop-container">

  <h2 class="title">Our Gifts Collection</h2>

  <div class="gift-list">

    <div class="gift-card">
      <img src="/images/small-purse-studio-still-life (2).jpg" alt="Gift 1">
      <h3>Birthday Gift Box</h3>
      <p>Beautiful surprise box with ribbons.</p>
      <span class="price">₹499</span>
        <div class="btn">
      <button (click)='addToCart()' >Add to Cart</button>
</div>
    </div>

    <div class="gift-card">
      <img src="/images/bag10.jpg" alt="Gift 2">
      <h3>Flower Bouquet</h3>
      <p>Fresh roses arranged beautifully.</p>
      <span class="price">₹299</span>
        <div class ="btn">
      <button (click)='addToCart()'>Add to Cart</button>
</div>
    </div>

    <div class="gift-card">
      <img src="/images/crochet23.jpg" alt="Gift 3">
      <h3>Soft Teddy Bear</h3>
      <p>Soft toy perfect for gifting loved ones.</p>
      <span class="price">₹399</span>
        <div class="btn">
      <button (click)='addToCart()'>Add to Cart</button>
</div>
    </div>

    <div class="gift-card">
      <img src="/images/crochet63.jpg" alt="Gift 4">
      <h3>Chocolate Box</h3>
      <p>Premium assorted chocolates pack.</p>
      <span class="price">₹599</span>
        <div class="btn">
      <button (click)='addToCart()' >Add to Cart</button>
        </div>
    </div>

  </div>
</div>


</body>
</html>
