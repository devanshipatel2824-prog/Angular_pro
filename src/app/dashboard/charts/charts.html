<html>
<head>
<title>Static Charts</title>
<link rel="stylesheet" href="charts.css">
</head>
<body>

<!-- Bar Chart -->
<h2>Static Bar Chart</h2>
<div class="bar-chart">
    <div class="bar"><span>Product A:</span> <div class="value b1"></div></div>
    <div class="bar"><span>Product B:</span> <div class="value b2"></div></div>
    <div class="bar"><span>Product C:</span> <div class="value b3"></div></div>
</div>

<!-- Pie Chart -->
<h2>Static Pie Chart</h2>
<div class="pie-chart-box">
    <div class="pie-chart"></div>
</div>

<div class="pie-legend">
    <div style="color:#e74c3c;">Red: 40%</div>
    <div style="color:#3498db;">Blue: 30%</div>
    <div style="color:#2ecc71;">Green: 30%</div>
</div>


</body>
</html>
